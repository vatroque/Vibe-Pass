<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="color-scheme" content="dark" />

    <title>Vibe Pass — Abu Dhabi Events, Venues &amp; Talent</title>
    <meta
      name="description"
      content="Vibe Pass is a UAE-native super-app for live events ticketing and verified talent management across Abu Dhabi and Dubai."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibe Pass" />
    <meta property="og:title" content="Vibe Pass — Abu Dhabi Events, Venues &amp; Talent" />
    <meta
      property="og:description"
      content="Discover live events, claim venue spots, and book verified talent across Abu Dhabi and Dubai."
    />
    <meta property="og:image" content="./og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Typefaces. css/styles.css also carries an @import fallback so the
         stylesheet stays self-sufficient if these tags are ever removed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    />
  </head>

  <body>
    <noscript>Vibe Pass requires JavaScript to run.</noscript>

    <!-- React mounts here. See js/main.js. -->
    <div id="root"></div>

    <!-- Single entry point. Vite rewrites this to a hashed, bundled asset at
         build time; in dev it is served as a native ES module. Everything
         else — css/styles.css, js/router.js, js/components/* — is reached
         through this module's own import graph, never via extra <script> or
         <link> tags. -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
