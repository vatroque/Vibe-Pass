<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="color-scheme" content="dark" />

    <title>Vibe Pass — Abu Dhabi Events, Venues &amp; Talent</title>
    <meta
      name="description"
      content="Vibe Pass is a UAE-native super-app for live events ticketing and verified talent management across Abu Dhabi and Dubai."
    />
    <link rel="canonical" href="https://vatroque.github.io/Vibe-Pass/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vibe Pass" />
    <meta property="og:title" content="Vibe Pass — Abu Dhabi Events, Venues &amp; Talent" />
    <meta
      property="og:description"
      content="Discover live events, claim venue spots, and book verified talent across Abu Dhabi and Dubai."
    />
    <meta property="og:url" content="https://vatroque.github.io/Vibe-Pass/" />
    <!-- og:image intentionally omitted: no share image asset exists in the repo yet.
         Add a real 1200x630 image and this tag before relying on rich social previews. -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vibe Pass — Abu Dhabi Events, Venues &amp; Talent" />
    <meta
      name="twitter:description"
      content="Discover live events, claim venue spots, and book verified talent across Abu Dhabi and Dubai."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Typefaces. The application also injects this same stylesheet at runtime
         (see FONT_HREF in src/main.jsx); requesting it here as well starts the
         download during HTML parse instead of after the bundle executes. The
         URLs are identical, so the browser serves one from cache. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
    />
  </head>

  <body>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0A0C;color:#F5F5F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:2rem;box-sizing:border-box;">
        <div style="max-width:420px;">
          <h1 style="font-size:1.25rem;margin:0 0 0.75rem;">JavaScript is required</h1>
          <p style="margin:0;color:#A0A0AB;line-height:1.5;">
            Vibe Pass needs JavaScript enabled to load live events, venues, and talent
            bookings. Please enable JavaScript in your browser settings and reload
            this page.
          </p>
        </div>
      </div>
    </noscript>

    <!-- React mounts here. -->
    <div id="root"></div>

    <!-- Single entry point. Vite compiles this to a hashed, bundled asset at
         build time and rewrites the src below to match; in dev it is served
         as a native ES module. React, lucide-react and d3 are resolved from
         node_modules and bundled — there is no CDN or import map involved. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
