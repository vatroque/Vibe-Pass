name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # This app is a single self-contained static index.html (Tailwind Play
      # CDN + an import map + Babel Standalone transpiling in-browser — no
      # bundler involved), so deployment is a straight file copy. There is no
      # npm build step because there is nothing for a bundler to do; see
      # README.md "Known items" for the status of the separate Vite/React
      # module split that this repo does not yet contain.
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp favicon.svg _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
