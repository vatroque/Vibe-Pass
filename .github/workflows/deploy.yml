name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Pins the Pages build type to "workflow". Without this the repository can
      # fall back to the legacy branch-based deployment, which publishes the
      # repository root verbatim — and the root index.html references
      # /src/main.jsx, uncompiled JSX that no browser can execute. Serving the
      # raw tree would therefore blank the site. This step keeps the compiled
      # dist/ output as the only thing that can ever be published.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
